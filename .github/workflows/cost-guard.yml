name: Cost guard

# Every push, not only pull requests. Three repositories depend on this one, so a broken
# guard on any branch is worth knowing about before it becomes a tag they consume.

on:
  push:
  pull_request:
  # Required: an auto-merge push raises no events, so this must be dispatchable.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  exit-contract:
    name: Exit-code contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert exact cost-guard exit codes
        run: bash scripts/test-cost-guard.sh

      # A suite nobody has watched fail is a suite nobody has tested. This mutates a
      # throwaway copy of the tree and asserts the suite notices — including a guard that
      # quietly acquires a network call, which changes no fixture's expected exit code.
      - name: The suite must be able to fail
        run: bash scripts/test-suite-can-fail.sh

      # Every other negative case in this suite is about content. This one is about
      # size, which is the gap that let a released guard hang on a real plan while
      # passing everything it had.
      - name: The guard survives a realistically-sized plan
        run: bash scripts/test-plan-size.sh

      - name: The freshness signal obeys its own rules
        run: bash scripts/test-freshness.sh

      # The property the freshness signal was made a separate action to protect. Runs the
      # exit contract with the network actually removed, and fails rather than skipping if
      # this runner offers no isolation — an unproven proof is what this repository keeps
      # finding at the bottom of its own defects.
      - name: The verdict does not depend on the network
        run: bash scripts/test-no-network.sh

  consumer:
    name: Consumed from another repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Builds a separate git repository holding neither the guard nor the denylist, and
      # runs the action's entrypoint against plans that repository wrote itself.
      - name: A repository with no copy of the guard gets the right verdicts
        run: bash scripts/demo-consumer.sh

  manifest:
    name: Action manifest resolves on a runner
    runs-on: ubuntu-latest
    # scripts/demo-consumer.sh cannot prove that GitHub itself accepts action.yml, because
    # resolving `uses:` is the runner's job and not something a shell script can stand in
    # for. This job covers that half: the runner parses the manifest, binds the inputs and
    # outputs, and runs the composite step for real.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: A clean plan is allowed
        id: clean
        uses: ./
        with:
          plan: tests/fixtures/plan-clean.json

      - name: The allow verdict reached the consumer as an output
        run: |
          set -euo pipefail
          [ "${{ steps.clean.outputs.verdict }}" = "allow" ] \
            || { echo "expected allow, got '${{ steps.clean.outputs.verdict }}'"; exit 1; }
          [ "${{ steps.clean.outputs.exit-code }}" = "0" ] \
            || { echo "expected exit-code 0"; exit 1; }

      - name: A denied create fails the step
        id: denied
        continue-on-error: true
        uses: ./
        with:
          plan: tests/fixtures/plan-with-nat.json

      - name: The deny verdict failed the step rather than passing it
        run: |
          set -euo pipefail
          [ "${{ steps.denied.outcome }}" = "failure" ] \
            || { echo "a denied create did not fail the step"; exit 1; }
          [ "${{ steps.denied.outputs.verdict }}" = "deny" ] \
            || { echo "expected deny, got '${{ steps.denied.outputs.verdict }}'"; exit 1; }

      # The fail-closed contract, asserted through the interface rather than only through
      # the guard. A wrapper that quietly turned exit 2 into a pass would be the easiest
      # possible way to lose this property without touching cost-guard.sh at all.
      - name: Unrecognizable input fails closed through the action
        id: garbage
        continue-on-error: true
        uses: ./
        with:
          plan: tests/fixtures/plan-unrecognizable.txt

      - name: The undecidable verdict is not softer than a denial
        run: |
          set -euo pipefail
          [ "${{ steps.garbage.outcome }}" = "failure" ] \
            || { echo "unrecognizable input did not fail the step"; exit 1; }
          [ "${{ steps.garbage.outputs.verdict }}" = "undecidable" ] \
            || { echo "expected undecidable, got '${{ steps.garbage.outputs.verdict }}'"; exit 1; }
          [ "${{ steps.garbage.outputs.exit-code }}" = "2" ] \
            || { echo "expected exit-code 2"; exit 1; }

  freshness:
    name: Freshness reported through the action
    runs-on: ubuntu-latest
    # scripts/test-freshness.sh covers the rules with a stubbed API. This covers what a
    # stub cannot: that the runner resolves the sub-action, binds its inputs and outputs,
    # and that a real release lookup against a real repository behaves as documented.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: An old immutable pin is reported behind
        id: old
        uses: ./freshness
        with:
          pin: martcoca/cost-guard@v1.0.0

      - name: The moving tag is reported current, not behind
        id: moving
        uses: ./freshness
        with:
          pin: martcoca/cost-guard@v1

      # The rule that keeps every consumer's CI independent of this lookup. A repository
      # that cannot be reached must report unknown and must still pass, even asking to
      # fail on staleness.
      - name: A repository that cannot be reached is unknown, and does not fail
        id: unreachable
        uses: ./freshness
        with:
          pin: martcoca/does-not-exist-cost-guard@v1.0.0
          fail-on-stale: 'true'

      - name: Assert the three statuses, and that unknown never became current
        shell: bash
        env:
          OLD: ${{ steps.old.outputs.status }}
          MOVING: ${{ steps.moving.outputs.status }}
          UNREACHABLE: ${{ steps.unreachable.outputs.status }}
          UNREACHABLE_OUTCOME: ${{ steps.unreachable.outcome }}
        run: |
          set -euo pipefail
          failed=0
          assert() {
            local label=$1 want=$2 got=$3
            if [[ "$got" != "$want" ]]; then
              printf '%s: expected %s, got %s\n' "$label" "$want" "$got" >&2
              failed=1
            else
              printf '%s: %s\n' "$label" "$got"
            fi
          }
          assert 'pinned to v1.0.0'        behind  "$OLD"
          assert 'pinned to the moved v1'  current "$MOVING"
          assert 'unreachable repository'  unknown "$UNREACHABLE"
          assert 'unreachable step result' success "$UNREACHABLE_OUTCOME"
          [[ "$failed" -eq 0 ]] || {
            printf '\nThe freshness signal does not behave as documented.\n' >&2
            exit 1
          }

